# Keeps the Supabase project from being paused.
#
# Supabase pauses free-tier projects that see no activity for 7 days, which
# would take down accounts, favorites, itineraries and the travel agent
# (campsite data ships inside the app and is unaffected). Every 3 days this
# runs one tiny read against the database through the public REST API.
#
# The URL and key below are the same public values as EXPO_PUBLIC_SUPABASE_URL
# and EXPO_PUBLIC_SUPABASE_ANON_KEY in app/.env. They already ship in
# the live site's JavaScript, and the database's Row Level Security decides
# what they can reach, so they are safe to keep here. Never put the
# service-role / secret key in this file.
#
# Note: GitHub turns off scheduled workflows in a repo with no commits for
# 60 days, and emails before it does. Re-enable it from the Actions tab.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://wmnxnxsyanbdyfbpccwb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_aqtH3Mb1Ba63_U9Ng4v19g_fEk89Le5
        run: |
          # `favorites` is the table the app itself uses (0003). Row Level
          # Security hands an anonymous caller an empty list, but the query
          # still runs in Postgres, which is the activity Supabase counts.
          # (`sites` from 0001 was never created in the live project.)
          # Only the apikey header: the project uses a new-style
          # sb_publishable_ key, which is not a JWT, so it can't go in an
          # Authorization: Bearer header.
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/favorites?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          [ "$status" -lt 400 ]
