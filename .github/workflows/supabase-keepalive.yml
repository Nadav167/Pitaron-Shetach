# Keeps the Supabase project from being paused.
#
# Supabase pauses free-tier projects that see no activity for 7 days, which
# would take down accounts, favorites, itineraries and the travel agent
# (campsite data ships inside the app and is unaffected). Every 3 days this
# runs one tiny read against the database through the public REST API.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       same value as EXPO_PUBLIC_SUPABASE_URL in app/.env
#   SUPABASE_ANON_KEY  same value as EXPO_PUBLIC_SUPABASE_ANON_KEY in app/.env
# Only the public anon key: never put the service-role key here.
#
# Note: GitHub turns off scheduled workflows in a repo with no commits for
# 60 days, and emails before it does. Re-enable it from the Actions tab.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # `sites` is publicly readable (see supabase/migrations/0001_init.sql).
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/sites?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          [ "$status" -lt 400 ]
